<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<title>لوحة إدارة المنتجات</title>

<style>
:root{
  --bg:#0f172a;
  --card:#111827;
  --soft:#1f2937;
  --border:#2a2f3a;
  --accent:#6366f1;
  --accent2:#22c55e;
  --text:#e5e7eb;
  --muted:#9ca3af;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial, sans-serif;
}

.container{
  max-width:900px;
  margin:40px auto;
  background:var(--card);
  padding:30px;
  border-radius:16px;
}

.tabs{
  display:flex;
  gap:10px;
  border-bottom:1px solid var(--border);
  margin-bottom:25px;
}

.tab{
  background:none;
  border:none;
  color:var(--muted);
  padding:10px 16px;
  cursor:pointer;
}

.tab.active{
  background:var(--soft);
  color:#fff;
  border-bottom:3px solid var(--accent);
}

.tab-content{display:none}
.tab-content.active{display:block}

label{display:block;margin:16px 0 6px}

input,textarea{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid var(--border);
  background:var(--soft);
  color:#fff;
}

button.save{
  margin-top:30px;
  padding:14px 22px;
  background:var(--accent2);
  border:none;
  border-radius:12px;
  color:#fff;
  cursor:pointer;
}

.product-card{
  background:#1f2937;
  padding:15px;
  border-radius:10px;
  margin-bottom:12px;
}

.product-images img{
  width:80px;
  height:80px;
  object-fit:cover;
  border-radius:8px;
  margin:5px;
}
</style>
</head>

<body>

<div class="container">
  <h2>➕ إضافة منتج جديد</h2>

  <div class="tabs">
    <button class="tab active" data-tab="data">📦 البيانات</button>
    <button class="tab" data-tab="desc">📝 الوصف</button>
    <button class="tab" data-tab="media">🖼️ الوسائط</button>
  </div>

  <div id="data" class="tab-content active">
    <label>اسم المنتج</label>
    <input id="productName">

    <label>السعر</label>
    <input id="productPrice" type="number">

    <label>التصنيف</label>
    <input id="productCategory">
  </div>

  <div id="desc" class="tab-content">
    <label>الوصف</label>
    <textarea id="productDesc"></textarea>
  </div>

  <div id="media" class="tab-content">
    <label>صور المنتج (حتى 10)</label>
    <input type="file" id="productImages" multiple accept="image/*">
  </div>

  <button class="save" id="saveBtn">💾 حفظ المنتج</button>

  <hr style="margin:40px 0">

  <h3>📦 المنتجات المسجلة</h3>
  <div id="productsList"></div>
</div>

<script>
// ================= Tabs =================
document.querySelectorAll(".tab").forEach(tab=>{
  tab.onclick = ()=>{
    document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
    document.querySelectorAll(".tab-content").forEach(c=>c.classList.remove("active"));
    tab.classList.add("active");
    document.getElementById(tab.dataset.tab).classList.add("active");
  };
});

// ================= Load Products =================
async function loadProducts(){
  const res = await fetch("/api/products");
  const products = await res.json();
  const list = document.getElementById("productsList");
  list.innerHTML = "";

  if(products.length === 0){
    list.innerHTML = "<p>لا يوجد منتجات</p>";
    return;
  }

  products.forEach(p=>{
    list.innerHTML += `
      <div class="product-card">
        <strong>${p.name}</strong> — ${p.price} جنيه<br>
        <small>${p.category || ""}</small>

        <div class="product-images">
          ${(p.images || []).map(img=>`<img src="${img}">`).join("")}
        </div>
      </div>
    `;
  });
}

loadProducts();

// ================= Save Product =================
document.getElementById("saveBtn").onclick = async ()=>{
  const fd = new FormData();

  fd.append("name", productName.value.trim());
  fd.append("price", productPrice.value.trim());
  fd.append("category", productCategory.value.trim());
  fd.append("description", productDesc.value.trim());

  const files = document.getElementById("productImages").files;
  for(let i=0;i<files.length;i++){
    fd.append("images", files[i]);
  }

  const res = await fetch("/api/products",{
    method:"POST",
    body: fd
  });

  if(res.ok){
    alert("✅ تم حفظ المنتج");
    productName.value="";
    productPrice.value="";
    productCategory.value="";
    productDesc.value="";
    productImages.value="";
    loadProducts();
  }else{
    alert("❌ فشل الحفظ");
  }
};
</script>

</body>
</html>
