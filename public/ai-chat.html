<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Chat - MT Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .chat-container { height: calc(100vh - 64px); }
    @media (max-width: 767px) { .chat-container { height: calc(100vh - 112px); margin-top: 48px !important; } }
    .message-content { white-space: pre-wrap; word-wrap: break-word; }
    .message-content a { color: #8b5cf6; text-decoration: underline; }
    .message-content strong { font-weight: 600; }
    .provider-btn.active { ring: 2px; ring-offset: 2px; }
    .typing-indicator span { animation: bounce 1.4s infinite ease-in-out both; }
    .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
    .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
    @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
  </style>
</head>
<body class="bg-gray-50">
  <nav class="bg-white shadow-sm border-b fixed top-0 left-0 right-0 z-50">
    <div class="max-w-full mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-8">
        <a href="/dashboard" class="text-2xl font-bold text-purple-600">MT Hub</a>
        <div class="hidden md:flex space-x-1">
          <a href="/dashboard" class="px-4 py-2 text-gray-600 hover:text-gray-900">Social AI</a>
          <a href="/ugc" class="px-4 py-2 text-gray-600 hover:text-gray-900">UGC Hub</a>
          <a href="/ai-chat" class="px-4 py-2 text-purple-600 font-medium border-b-2 border-purple-600">AI Tools</a>
        </div>
      </div>
      <div id="user-info" class="flex items-center space-x-4">
        <span id="user-name" class="text-gray-600"></span>
        <a href="/api/logout" class="text-gray-600 hover:text-gray-800">Logout</a>
      </div>
    </div>
  </nav>

  <!-- Mobile Nav -->
  <div class="md:hidden fixed top-16 left-0 right-0 z-40 bg-white border-b px-4 py-2 flex space-x-2 overflow-x-auto">
    <a href="/dashboard" class="px-3 py-1.5 text-gray-600 hover:bg-gray-100 rounded-full text-sm whitespace-nowrap">Social AI</a>
    <a href="/ugc" class="px-3 py-1.5 text-gray-600 hover:bg-gray-100 rounded-full text-sm whitespace-nowrap">UGC Hub</a>
    <a href="/ai-chat" class="px-3 py-1.5 bg-purple-100 text-purple-700 rounded-full text-sm font-medium whitespace-nowrap">AI Tools</a>
  </div>

  <div class="chat-container mt-16 flex">
    <aside id="sidebar" class="w-72 bg-white border-r flex flex-col">
      <div class="p-4 border-b">
        <button onclick="createNewChat()" class="w-full bg-purple-600 text-white py-2.5 px-4 rounded-lg hover:bg-purple-700 flex items-center justify-center space-x-2">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
          </svg>
          <span>New Chat</span>
        </button>
      </div>
      
      <div class="p-3 border-b">
        <div id="providers" class="flex flex-wrap gap-2"></div>
      </div>
      
      <div class="flex-1 overflow-y-auto" id="chat-list"></div>
    </aside>

    <main class="flex-1 flex flex-col bg-gray-50">
      <div id="empty-state" class="flex-1 flex items-center justify-center">
        <div class="text-center">
          <div class="text-6xl mb-4">AI</div>
          <h2 class="text-2xl font-semibold text-gray-700 mb-2">Welcome to AI Chat</h2>
          <p class="text-gray-500 mb-6">Choose an AI provider and start a conversation</p>
          <div id="provider-cards" class="flex flex-wrap justify-center gap-4 max-w-2xl"></div>
        </div>
      </div>

      <div id="chat-area" class="flex-1 flex flex-col hidden">
        <div id="chat-header" class="bg-white border-b px-6 py-3 flex items-center justify-between">
          <div class="flex items-center space-x-3">
            <span id="chat-provider-icon" class="text-2xl"></span>
            <div>
              <h2 id="chat-title" class="font-semibold text-gray-800"></h2>
              <p id="chat-model" class="text-sm text-gray-500"></p>
            </div>
          </div>
          <div class="flex items-center space-x-2">
            <select id="model-select" class="text-sm border rounded-lg px-3 py-1.5 bg-white"></select>
            <button onclick="deleteCurrentChat()" class="text-gray-400 hover:text-red-500 p-2">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
              </svg>
            </button>
          </div>
        </div>

        <div id="messages" class="flex-1 overflow-y-auto p-6 space-y-4"></div>

        <div class="bg-white border-t p-4">
          <div id="media-options" class="mb-3 hidden">
            <div class="flex flex-wrap gap-2 text-sm">
              <label class="flex items-center space-x-2 text-gray-600">
                <span>Aspect Ratio:</span>
                <select id="aspect-ratio" class="border rounded px-2 py-1">
                  <option value="16:9">16:9</option>
                  <option value="9:16">9:16</option>
                  <option value="1:1">1:1</option>
                  <option value="4:3">4:3</option>
                </select>
              </label>
              <label id="duration-option" class="flex items-center space-x-2 text-gray-600 hidden">
                <span>Duration:</span>
                <select id="video-duration" class="border rounded px-2 py-1">
                  <option value="5">5 sec</option>
                  <option value="10">10 sec</option>
                </select>
              </label>
            </div>
          </div>
          <div class="flex space-x-3">
            <input type="text" id="message-input" placeholder="Type your message..." 
                   class="flex-1 border rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-purple-500"
                   onkeydown="if(event.key==='Enter' && !event.shiftKey) sendMessage()">
            <button onclick="sendMessage()" id="send-btn" 
                    class="bg-purple-600 text-white px-6 py-3 rounded-xl hover:bg-purple-700 disabled:opacity-50 disabled:cursor-not-allowed">
              Send
            </button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    let providers = [];
    let chats = [];
    let currentChat = null;
    let currentProvider = null;
    let isLoading = false;

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function formatContent(content, type) {
      if (type === 'image') {
        return `<img src="${escapeHtml(content)}" alt="Generated image" class="max-w-full rounded-lg shadow-md max-h-96">`;
      }
      if (type === 'video') {
        return `<video src="${escapeHtml(content)}" controls class="max-w-full rounded-lg shadow-md max-h-96"></video>`;
      }
      let formatted = escapeHtml(content);
      formatted = formatted.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
      formatted = formatted.replace(/\[(.*?)\]\((https?:\/\/[^\)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
      return formatted;
    }

    async function init() {
      try {
        const userRes = await fetch('/api/auth/user', { credentials: 'include' });
        if (!userRes.ok) {
          window.location.href = '/api/login';
          return;
        }
        const user = await userRes.json();
        document.getElementById('user-name').textContent = user.username || user.email || 'User';

        await loadProviders();
        await loadChats();
      } catch (e) {
        console.error('Init error:', e);
      }
    }

    async function loadProviders() {
      try {
        const res = await fetch('/api/ai-chat/providers', { credentials: 'include' });
        providers = await res.json();
        renderProviders();
        renderProviderCards();
      } catch (e) {
        console.error('Load providers error:', e);
      }
    }

    function renderProviders() {
      const container = document.getElementById('providers');
      container.innerHTML = providers.map(p => `
        <button onclick="selectProvider('${p.id}')" 
                class="provider-btn px-3 py-1.5 rounded-full text-sm flex items-center space-x-1 
                       ${currentProvider?.id === p.id ? 'bg-purple-100 text-purple-700 ring-2 ring-purple-500' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'}">
          <span>${p.icon}</span>
          <span>${escapeHtml(p.name)}</span>
        </button>
      `).join('');
    }

    function renderProviderCards() {
      const container = document.getElementById('provider-cards');
      container.innerHTML = providers.map(p => `
        <button onclick="startChatWithProvider('${p.id}')" 
                class="bg-white p-6 rounded-xl shadow-sm border hover:shadow-md transition-shadow text-center w-40">
          <div class="text-4xl mb-3">${p.icon}</div>
          <h3 class="font-semibold text-gray-800">${escapeHtml(p.name)}</h3>
          <p class="text-xs text-gray-500 mt-1">${escapeHtml(p.capabilities.join(', '))}</p>
        </button>
      `).join('');
    }

    function selectProvider(providerId) {
      currentProvider = providers.find(p => p.id === providerId);
      renderProviders();
      updateMediaOptions();
    }

    function updateMediaOptions() {
      const mediaOptions = document.getElementById('media-options');
      const durationOption = document.getElementById('duration-option');
      
      if (currentProvider && currentProvider.capabilities.includes('image')) {
        mediaOptions.classList.remove('hidden');
        if (currentProvider.capabilities.includes('video')) {
          durationOption.classList.remove('hidden');
        } else {
          durationOption.classList.add('hidden');
        }
      } else {
        mediaOptions.classList.add('hidden');
      }
    }

    async function loadChats() {
      try {
        const res = await fetch('/api/ai-chat/chats', { credentials: 'include' });
        chats = await res.json();
        renderChatList();
      } catch (e) {
        console.error('Load chats error:', e);
      }
    }

    function renderChatList() {
      const container = document.getElementById('chat-list');
      if (chats.length === 0) {
        container.innerHTML = '<div class="p-4 text-center text-gray-400">No chats yet</div>';
        return;
      }
      container.innerHTML = chats.map(chat => {
        const provider = providers.find(p => p.id === chat.providerId) || { icon: 'AI', name: 'Unknown' };
        return `
          <div onclick="openChat(${chat.id})" 
               class="p-3 hover:bg-gray-50 cursor-pointer border-b ${currentChat?.id === chat.id ? 'bg-purple-50' : ''}">
            <div class="flex items-center space-x-2">
              <span class="text-xl">${provider.icon}</span>
              <div class="flex-1 min-w-0">
                <div class="font-medium text-gray-800 truncate">${escapeHtml(chat.title)}</div>
                <div class="text-xs text-gray-500">${escapeHtml(provider.name)}</div>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    async function createNewChat() {
      if (!currentProvider) {
        currentProvider = providers[0];
      }
      try {
        const res = await fetch('/api/ai-chat/chats', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({
            providerId: currentProvider.id,
            model: currentProvider.models.find(m => m.default)?.id || currentProvider.models[0]?.id,
          }),
        });
        const chat = await res.json();
        chats.unshift(chat);
        renderChatList();
        openChat(chat.id);
      } catch (e) {
        console.error('Create chat error:', e);
      }
    }

    async function startChatWithProvider(providerId) {
      selectProvider(providerId);
      await createNewChat();
    }

    async function openChat(chatId) {
      try {
        const res = await fetch(`/api/ai-chat/chats/${chatId}`, { credentials: 'include' });
        const data = await res.json();
        currentChat = data.chat;
        currentProvider = providers.find(p => p.id === currentChat.providerId);
        
        document.getElementById('empty-state').classList.add('hidden');
        document.getElementById('chat-area').classList.remove('hidden');
        
        const provider = currentProvider || { icon: 'AI', name: 'Unknown' };
        document.getElementById('chat-provider-icon').textContent = provider.icon;
        document.getElementById('chat-title').textContent = currentChat.title;
        document.getElementById('chat-model').textContent = currentChat.model || provider.models?.[0]?.name || '';
        
        const modelSelect = document.getElementById('model-select');
        modelSelect.innerHTML = (provider.models || []).map(m => 
          `<option value="${m.id}" ${currentChat.model === m.id ? 'selected' : ''}>${escapeHtml(m.name)}</option>`
        ).join('');
        
        renderMessages(data.messages);
        renderChatList();
        renderProviders();
        updateMediaOptions();
        
        document.getElementById('message-input').focus();
      } catch (e) {
        console.error('Open chat error:', e);
      }
    }

    function renderMessages(messages) {
      const container = document.getElementById('messages');
      if (messages.length === 0) {
        container.innerHTML = `
          <div class="text-center text-gray-400 py-8">
            <p>Start your conversation!</p>
          </div>
        `;
        return;
      }
      container.innerHTML = messages.map(msg => `
        <div class="flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}">
          <div class="max-w-2xl ${msg.role === 'user' ? 'bg-purple-600 text-white' : 'bg-white border'} rounded-2xl px-4 py-3 shadow-sm">
            <div class="message-content">${formatContent(msg.content, msg.type)}</div>
            ${msg.metadata?.sources ? `
              <div class="mt-2 pt-2 border-t border-gray-200 text-xs text-gray-500">
                ${msg.metadata.sources.length} sources
              </div>
            ` : ''}
          </div>
        </div>
      `).join('');
      container.scrollTop = container.scrollHeight;
    }

    function addTypingIndicator() {
      const container = document.getElementById('messages');
      const indicator = document.createElement('div');
      indicator.id = 'typing-indicator';
      indicator.className = 'flex justify-start';
      indicator.innerHTML = `
        <div class="bg-white border rounded-2xl px-4 py-3 shadow-sm">
          <div class="typing-indicator flex space-x-1">
            <span class="w-2 h-2 bg-gray-400 rounded-full"></span>
            <span class="w-2 h-2 bg-gray-400 rounded-full"></span>
            <span class="w-2 h-2 bg-gray-400 rounded-full"></span>
          </div>
        </div>
      `;
      container.appendChild(indicator);
      container.scrollTop = container.scrollHeight;
    }

    function removeTypingIndicator() {
      const indicator = document.getElementById('typing-indicator');
      if (indicator) indicator.remove();
    }

    async function sendMessage() {
      if (isLoading || !currentChat) return;
      
      const input = document.getElementById('message-input');
      const content = input.value.trim();
      if (!content) return;

      input.value = '';
      isLoading = true;
      document.getElementById('send-btn').disabled = true;

      const container = document.getElementById('messages');
      const emptyMsg = container.querySelector('.text-center.text-gray-400');
      if (emptyMsg) emptyMsg.remove();
      
      container.innerHTML += `
        <div class="flex justify-end">
          <div class="max-w-2xl bg-purple-600 text-white rounded-2xl px-4 py-3 shadow-sm">
            <div class="message-content">${escapeHtml(content)}</div>
          </div>
        </div>
      `;
      container.scrollTop = container.scrollHeight;
      
      addTypingIndicator();

      try {
        const model = document.getElementById('model-select').value;
        const options = {};
        
        if (currentProvider?.capabilities.includes('image')) {
          options.aspectRatio = document.getElementById('aspect-ratio').value;
          if (currentProvider.capabilities.includes('video') && model?.startsWith('ray')) {
            options.duration = parseInt(document.getElementById('video-duration').value);
          }
        }

        const res = await fetch(`/api/ai-chat/chats/${currentChat.id}/messages`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ content, model, options }),
        });

        removeTypingIndicator();

        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.error || 'Failed to send message');
        }

        const result = await res.json();
        
        container.innerHTML += `
          <div class="flex justify-start">
            <div class="max-w-2xl bg-white border rounded-2xl px-4 py-3 shadow-sm">
              <div class="message-content">${formatContent(result.assistantMessage.content, result.assistantMessage.type)}</div>
            </div>
          </div>
        `;
        container.scrollTop = container.scrollHeight;

        await loadChats();
      } catch (e) {
        removeTypingIndicator();
        console.error('Send message error:', e);
        container.innerHTML += `
          <div class="flex justify-start">
            <div class="max-w-2xl bg-red-50 border border-red-200 text-red-600 rounded-2xl px-4 py-3 shadow-sm">
              Error: ${escapeHtml(e.message)}
            </div>
          </div>
        `;
      } finally {
        isLoading = false;
        document.getElementById('send-btn').disabled = false;
        input.focus();
      }
    }

    async function deleteCurrentChat() {
      if (!currentChat) return;
      if (!confirm('Delete this chat?')) return;
      
      try {
        await fetch(`/api/ai-chat/chats/${currentChat.id}`, {
          method: 'DELETE',
          credentials: 'include',
        });
        currentChat = null;
        document.getElementById('empty-state').classList.remove('hidden');
        document.getElementById('chat-area').classList.add('hidden');
        await loadChats();
      } catch (e) {
        console.error('Delete chat error:', e);
      }
    }

    init();
  </script>
</body>
</html>
